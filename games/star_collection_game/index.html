<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Star Shower</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="../../index.html">← Back to Pip</a>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="hud">
      <span>Level <b id="lv">1</b></span>
      <span>Score <b id="sc">0</b> / <b id="goal">10</b></span>
      <span>Time <b id="tm">30</b></span>
    </div>
    <div id="bar"><div id="fill"></div></div>
    <div id="panel">
      <h1 id="ptitle">Star Shower</h1>
      <p id="pmsg">Move the basket with your <b>mouse</b>, <b>finger</b> or <b>← → keys</b>. Catch the falling stars. Dodge the <span class="rock">red meteoroids</span>: each one costs you 3 points and a life.</p>
      <p>Reach the target score within 30 seconds to unlock the next level.</p>
      <button id="go">Start game</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
